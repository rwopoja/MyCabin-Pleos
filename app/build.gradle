plugins { id 'com.android.application' }
android {
 namespace 'kr.mycabin.app'
 compileSdk 35
 defaultConfig { applicationId 'kr.mycabin.app'; minSdk 28; targetSdk 35; versionCode 1; versionName '0.1.0' }
 buildTypes { release { minifyEnabled false; debuggable false } }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
 sourceSets { main { assets.srcDirs = ['src/main/assets'] } }
}
tasks.register('syncWeb', Copy) { from('../web') { exclude 'assets/pleos-reference.png', 'assets/pleos-library.png' }; into('src/main/assets') }
tasks.named('preBuild').configure { dependsOn 'syncWeb' }
dependencies { implementation 'ai.pleos.playground:Vehicle:2.3.2' }
