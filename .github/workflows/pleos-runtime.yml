name: Pleos emulator installation check
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/pleos-runtime.yml'
permissions:
  contents: read
jobs:
  pleos:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
          log-accepted-android-sdk-licenses: false
      - name: Install build tools and build current APK
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          rm -f 'apk/김재윤_마이캐빈_release.apk'
          python3 scripts/build_local.py
      - name: Download official Pleos Connect 2.1 image
        run: |
          df -h
          curl --fail --location --retry 2 --max-time 1200 'https://nexus-playground.pleos.ai/repository/raw-releases/connect-avd/2.x/crp_car_emulator.zip' -o /tmp/pleos.zip
          echo 'b4f858d5bcc6c71506d7edfc872bcb9e5a11acaa  /tmp/pleos.zip' | sha1sum -c -
          unzip -q /tmp/pleos.zip -d /tmp/pleos-image
          rm /tmp/pleos.zip
          df -h
          find /tmp/pleos-image -name system.img -print
      - name: Configure and launch Pleos emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          python3 - <<'PY'
          import os, pathlib
          matches=list(pathlib.Path('/tmp/pleos-image').rglob('system.img'))
          if len(matches)!=1: raise SystemExit('Expected exactly one system.img; found '+str(matches))
          image_dir=matches[0].parent
          avd=pathlib.Path.home()/'.android/avd';avd.mkdir(parents=True,exist_ok=True)
          d=avd/'MyCabin_Pleos.avd';d.mkdir(exist_ok=True)
          (avd/'MyCabin_Pleos.ini').write_text('avd.ini.encoding=UTF-8\npath='+str(d)+'\ntarget=android-34\n')
          (d/'config.ini').write_text('AvdId=MyCabin_Pleos\nabi.type=x86_64\nimage.sysdir.1='+str(image_dir)+'/\nhw.cpu.arch=x86_64\nhw.cpu.ncore=4\nhw.ramSize=4096\nhw.lcd.width=1920\nhw.lcd.height=1080\nhw.lcd.density=160\nhw.gpu.enabled=yes\nhw.gpu.mode=swiftshader_indirect\ndisk.dataPartition.size=4096M\n')
          PY
          nohup emulator -avd MyCabin_Pleos -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim > /tmp/pleos-emulator.log 2>&1 &
          adb wait-for-device
          for i in $(seq 1 120); do if [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1 ]; then exit 0; fi; sleep 5; done
          tail -200 /tmp/pleos-emulator.log
          exit 1
      - name: Install and capture actual Pleos screen
        run: |
          mkdir -p pleos-evidence
          adb shell wm size > pleos-evidence/screen-size.txt
          adb shell wm density > pleos-evidence/screen-density.txt
          adb shell getprop > pleos-evidence/properties.txt
          adb install -r 'apk/김재윤_마이캐빈_release.apk'
          adb shell am start -W -n kr.mycabin.app/.MainActivity
          sleep 30
          adb shell uiautomator dump /sdcard/pleos-tree.xml
          adb pull /sdcard/pleos-tree.xml pleos-evidence/tree.xml
          adb exec-out screencap -p > pleos-evidence/screen.png
          adb logcat -d > pleos-evidence/logcat.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pleos-emulator-check
          path: |
            pleos-evidence/
            /tmp/pleos-emulator.log
          if-no-files-found: warn
